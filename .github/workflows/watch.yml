name: マイクラ新情報ウォッチ

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分おき（GitHub の混雑で数分遅れることがある）
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る（最新の各1件を送るだけで記録は変えない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mc-update-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備
        run: pip install --quiet -r requirements.txt

      - name: 新情報をチェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_MINOR: ${{ secrets.DISCORD_WEBHOOK_URL_MINOR }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_MINOR: ${{ vars.NOTIFY_MINOR }}
          SEND_TEST: ${{ inputs.test }}
        run: python watcher.py

      - name: 記録とカレンダーを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state.json calendar.ics; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "新情報の記録を更新"
            git pull --rebase --quiet
            git push
          fi
